<app-form [form]="modifyHomeDeviceNameForm" (onSubmit)="onSubmit()" title="Cambiar Nombre de Dispositivo Hogar" containerClass="min-vh-30">
    <app-home-devices-dropdown
        [(value)]="selectedHomeDevice"
        [name]="formField.homeDevice.name"
        [form]="modifyHomeDeviceNameForm"
        [formField]="formField" />

    <app-form-input
        type="text"
        placeholder="nombre"
        label="Nombre"
        [name]="formField.nombre.name"
        [form]="modifyHomeDeviceNameForm"
        [formField]="formField" />

    <div *ngIf="modifyStatus?.loading; else notLoading">Cargando...</div>

    <ng-template #notLoading>
        <div *ngIf="modifyStatus?.error" [ngStyle]="{ color: 'var(--bs-form-invalid-color)' }">
            {{ modifyStatus!.error }}
        </div>
        
        <div class="d-flex align-items-center">
            <app-form-button title="Confirmar" />
            <a routerLink="/home/myHomes" class="text-primary ms-2" style="cursor: pointer;">Cancelar</a>
        </div>
    </ng-template>
</app-form>
