<app-form [form]="createHomeForm" (onSubmit)="onSubmit($event)" title="Crear Hogar">
    <app-form-input
        type="text"
        placeholder="calle"
        label="Calle"
        [name]="formField.calle.name"
        [form]="createHomeForm"
        [formField]="formField" />

    <app-form-input
        type="number"
        placeholder="123"
        label="Numero de puera"
        [name]="formField.numPuerta.name"
        [form]="createHomeForm"
        [formField]="formField" />

    <app-form-input
        type="number"
        placeholder="latitud"
        label="Latitud"
        [name]="formField.latitud.name"
        [form]="createHomeForm"
        [formField]="formField" />

    <app-form-input
        type="number"
        placeholder="longitud"
        label="Longitud"
        [name]="formField.longitud.name"
        [form]="createHomeForm"
        [formField]="formField" />

    <app-form-input
        type="number"
        placeholder="miembros soportados"
        label="Cantidad miembros soportados"
        [name]="formField.cantMiembrosSoportados.name"
        [form]="createHomeForm"
        [formField]="formField" />

    <app-form-input
        type="text"
        placeholder="alias"
        label="Alias"
        [name]="formField.alias.name"
        [form]="createHomeForm"
        [formField]="formField" />

    <div *ngIf="createStatus?.loading; else notLoading">Cargando...</div>

    <ng-template #notLoading>
        <div *ngIf="createStatus?.error" [ngStyle]="{ color: 'var(--bs-form-invalid-color)' }">
            {{ createStatus!.error }}
        </div>
        
        <div class="d-flex align-items-center">
            <app-form-button title="Confirmar" />
            <a routerLink="/home" class="text-primary ms-2" style="cursor: pointer;">Cancelar</a>
        </div>
    </ng-template>
</app-form>
