<app-form [form]="disconnectHomeDeviceForm" (onSubmit)="onSubmit()" title="Conectar Dispositivo Hogar" containerClass="min-vh-30">
    <app-home-devices-dropdown
        [(value)]="selectedHomeDevice"
        [name]="formField.homeDevice.name"
        [form]="disconnectHomeDeviceForm"
        [formField]="formField" />

    <div *ngIf="disconnectStatus?.loading; else notLoading">Cargando...</div>

    <ng-template #notLoading>
        <div *ngIf="disconnectStatus?.error" [ngStyle]="{ color: 'var(--bs-form-invalid-color)' }">
            {{ disconnectStatus!.error }}
        </div>
        
        <div class="d-flex align-items-center">
            <app-form-button title="Confirmar" />
            <a routerLink="/home/myHomes" class="text-primary ms-2" style="cursor: pointer;">Cancelar</a>
        </div>
    </ng-template>
</app-form>
