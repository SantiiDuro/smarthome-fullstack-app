<app-form [form]="asignMemberForm" (onSubmit)="onSubmit()" title="Agregar Miembro" containerClass="min-vh-30">
    <app-form-input
        type="text"
        placeholder="email"
        label="Email del miembro"
        [name]="formField.email.name"
        [form]="asignMemberForm"
        [formField]="formField" />

    <app-home-permissions-checkbox label="Permisos" (optionsChange)="onCheckboxOptionsChange($event)" />

    <div *ngIf="asignStatus?.loading; else notLoading">Cargando...</div>

    <ng-template #notLoading>
        <div *ngIf="asignStatus?.error" [ngStyle]="{ color: 'var(--bs-form-invalid-color)' }">
            {{ asignStatus!.error }}
        </div>
        
        <div class="d-flex align-items-center">
            <app-form-button title="Confirmar" />
            <a routerLink="/home/myHomes" class="text-primary ms-2" style="cursor: pointer;">Cancelar</a>
        </div>
    </ng-template>
</app-form>
