<app-form [form]="assignDeviceHomeForm" (onSubmit)="onSubmit()" title="Asociar Dispositivo a Hogar" containerClass="min-vh-30">
    <app-device-dropdown
        [(value)]="selectedDevice"
        [name]="formField.device.name"
        [form]="assignDeviceHomeForm"
        [formField]="formField" />

    <div *ngIf="assignStatus?.loading; else notLoading">Cargando...</div>

    <ng-template #notLoading>
        <div *ngIf="assignStatus?.error" [ngStyle]="{ color: 'var(--bs-form-invalid-color)' }">
            {{ assignStatus!.error }}
        </div>
        
        <div class="d-flex align-items-center">
            <app-form-button title="Confirmar" />
            <a routerLink="/home/myHomes" class="text-primary ms-2" style="cursor: pointer;">Cancelar</a>
        </div>
    </ng-template>
</app-form>
