<app-form [form]="createRoomForm" (onSubmit)="onSubmit()" title="Crear Cuarto" containerClass="min-vh-30">
    <app-form-input
        type="text"
        placeholder="nombre"
        label="Nombre del cuarto"
        [name]="formField.nombre.name"
        [form]="createRoomForm"
        [formField]="formField" />

    <div *ngIf="createStatus?.loading; else notLoading">Cargando...</div>

    <ng-template #notLoading>
        <div *ngIf="createStatus?.error" [ngStyle]="{ color: 'var(--bs-form-invalid-color)' }">
            {{ createStatus!.error }}
        </div>
        
        <div class="d-flex align-items-center">
            <app-form-button title="Confirmar" />
            <a routerLink="/home/myHomes" class="text-primary ms-2" style="cursor: pointer;">Cancelar</a>
        </div>
    </ng-template>
</app-form>
