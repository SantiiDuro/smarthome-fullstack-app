<app-form [form]="assignHomeRoomForm" (onSubmit)="onSubmit()" title="Asociar Dispositivo a Cuarto" containerClass="min-vh-30">
    <app-home-devices-dropdown
        [(value)]="selectedHomeDevice"
        [name]="formField.homeDevice.name"
        [form]="assignHomeRoomForm"
        [formField]="formField" />

    <app-home-rooms-dropdown
        [(value)]="selectedHomeRoom"
        [name]="formField.homeRoom.name"
        [form]="assignHomeRoomForm"
        [formField]="formField" />

    <div *ngIf="assignStatus?.loading; else notLoading">Cargando...</div>

    <ng-template #notLoading>
        <div *ngIf="assignStatus?.error" [ngStyle]="{ color: 'var(--bs-form-invalid-color)' }">
            {{ assignStatus!.error }}
        </div>
        
        <div class="d-flex align-items-center">
            <app-form-button title="Confirmar" />
            <a routerLink="/home/myHomes" class="text-primary ms-2" style="cursor: pointer;">Cancelar</a>
        </div>
    </ng-template>
</app-form>
