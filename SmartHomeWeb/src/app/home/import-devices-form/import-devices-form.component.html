<app-form [form]="importDevicesForm" (onSubmit)="onSubmit($event)" title="Importar Dispositivos">
    <app-importers-dropdown
        [(value)]="selectedImporter"
        [name]="formField.identificadorImportador.name"
        [form]="importDevicesForm"
        [formField]="formField" />

    <app-form-input
        type="text"
        placeholder="ruta"
        label="Archivo a importar"
        [name]="formField.ruta.name"
        [form]="importDevicesForm"
        [formField]="formField" />

    <div *ngIf="importStatus?.loading; else notLoading">Cargando...</div>

    <ng-template #notLoading>
        <div *ngIf="importStatus?.error" [ngStyle]="{ color: 'var(--bs-form-invalid-color)' }">
            {{ importStatus!.error }}
        </div>
        
        <div class="d-flex align-items-center">
            <app-form-button title="Confirmar" />
            <a routerLink="/home" class="text-primary ms-2" style="cursor: pointer;">Cancelar</a>
        </div>
    </ng-template>
</app-form>
