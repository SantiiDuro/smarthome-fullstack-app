<app-form [form]="updatePermissionsForm" (onSubmit)="onSubmit($event)" title="Añadir Permisos de Dueño Hogar">
    <app-form-input
        type="text"
        placeholder="imagen.png"
        label="Foto de perfil"
        [name]="formField.fotoPerfil.name"
        [form]="updatePermissionsForm"
        [formField]="formField" />

    <div *ngIf="updateStatus?.loading; else notLoading">Cargando...</div>

    <ng-template #notLoading>
        <div *ngIf="updateStatus?.error" [ngStyle]="{ color: 'var(--bs-form-invalid-color)' }">
            {{ updateStatus!.error }}
        </div>
        
        <div class="d-flex align-items-center">
            <app-form-button title="Confirmar" />
            <a routerLink="/home" class="text-primary ms-2" style="cursor: pointer;">Cancelar</a>
        </div>
    </ng-template>
</app-form>
