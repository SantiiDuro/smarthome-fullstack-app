<div class="text-center my-4">
  <p *ngIf="title">{{ title }}</p>
</div>

<div class="d-flex justify-content-center my-4">
  <div *ngIf="items && items.length > 0; else noItems">
    <ul class="list-group">
      <li *ngFor="let item of items" class="list-group-item">
        {{ item.label }}
      </li>
    </ul>
  </div>

  <ng-template #noItems>
    <p class="text-muted text-center">{{ emptyMessage }}</p>
  </ng-template>
</div>
